[package]
name = "salvo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22"
libfuzzer-sys = "0.4"
salvo-jwt-auth = { path = "../crates/jwt-auth", features = ["oidc"] }
salvo-oapi = { path = "../crates/oapi" }
serde_json = "1"
tempfile = "3"
salvo-tus = { path = "../crates/tus" }
salvo_core = { path = "../crates/core", default-features = false, features = ["test"] }
salvo_extra = { path = "../crates/extra", default-features = false, features = ["basic-auth", "websocket", "caching-headers"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "path_filter"
path = "fuzz_targets/path_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "basic_auth"
path = "fuzz_targets/basic_auth.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tus_options"
path = "fuzz_targets/tus_options.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_upgrade"
path = "fuzz_targets/websocket_upgrade.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "cache_control"
path = "fuzz_targets/cache_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openapi_roundtrip"
path = "fuzz_targets/openapi_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conditional_headers"
path = "fuzz_targets/conditional_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart"
path = "fuzz_targets/multipart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tus_state"
path = "fuzz_targets/tus_state.rs"
test = false
doc = false
bench = false
