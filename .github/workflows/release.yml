name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: taiki-e/install-action@f84dff0ad3f25ff0e5dc531e626734a4e7d11ac7 # cargo-audit

      - name: Audit dependencies before publishing (warnings only)
        run: |
          cargo generate-lockfile
          python3 .github/scripts/audit_lockfile.py --file Cargo.lock

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          crates=(
            "salvo-serde-util:crates/serde-util"
            "salvo_macros:crates/macros"
            "salvo_core:crates/core"
            "salvo_extra:crates/extra"
            "salvo-proxy:crates/proxy"
            "salvo-compression:crates/compression"
            "salvo-jwt-auth:crates/jwt-auth"
            "salvo-session:crates/session"
            "salvo-flash:crates/flash"
            "salvo-cors:crates/cors"
            "salvo-csrf:crates/csrf"
            "salvo-cache:crates/cache"
            "salvo-rate-limiter:crates/rate-limiter"
            "salvo-serve-static:crates/serve-static"
            "salvo-otel:crates/otel"
            "salvo-oapi-macros:crates/oapi-macros"
            "salvo-oapi:crates/oapi"
            "salvo-craft-macros:crates/craft-macros"
            "salvo-craft:crates/craft"
            "salvo-acme:crates/acme"
            "salvo-tus:crates/tus"
            "salvo:crates/salvo"
          )

          crate_index_path() {
            local crate="${1,,}"

            case "${#crate}" in
              1)
                printf '1/%s\n' "$crate"
                ;;
              2)
                printf '2/%s\n' "$crate"
                ;;
              3)
                printf '3/%s/%s\n' "${crate:0:1}" "$crate"
                ;;
              *)
                printf '%s/%s/%s\n' "${crate:0:2}" "${crate:2:2}" "$crate"
                ;;
            esac
          }

          crate_is_published() {
            local crate="$1"
            local version="$2"
            local index_path

            index_path="$(crate_index_path "$crate")"
            curl --silent --show-error --fail --location \
              --header "Accept: text/plain" \
              --header "User-Agent: salvo-release-ci" \
              "https://index.crates.io/${index_path}" \
              | grep --fixed-strings --quiet "\"vers\":\"${version}\""
          }

          wait_for_crate() {
            local crate="$1"
            local version="$2"

            for attempt in {1..30}; do
              if crate_is_published "$crate" "$version"; then
                echo "${crate} ${version} is visible in the crates.io index"
                return 0
              fi

              echo "Waiting for ${crate} ${version} to become visible in the crates.io index (attempt ${attempt}/30)"
              sleep 10
            done

            echo "Timed out waiting for ${crate} ${version} to appear in the crates.io index" >&2
            return 1
          }

          publish_crate() {
            local crate="$1"
            local path="$2"
            local version

            version="$(
              python - <<'PY' "$path/Cargo.toml"
          import pathlib
          import sys

          cargo_toml = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          for line in cargo_toml.splitlines():
              stripped = line.strip()
              if stripped.startswith("version = "):
                  value = stripped.split("=", 1)[1].strip().strip('"')
                  if "{ workspace = true }" not in value:
                      print(value)
                      break
          else:
              root = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
              in_workspace_package = False
              for line in root.splitlines():
                  stripped = line.strip()
                  if stripped == "[workspace.package]":
                      in_workspace_package = True
                      continue
                  if in_workspace_package and stripped.startswith("["):
                      break
                  if in_workspace_package and stripped.startswith("version = "):
                      print(stripped.split("=", 1)[1].strip().strip('"'))
                      break
          PY
            )"

            echo "Processing ${crate} ${version}"

            if crate_is_published "$crate" "$version"; then
              echo "${crate} ${version} already published, skipping"
              return 0
            fi

            cargo publish --locked --dry-run --manifest-path "${path}/Cargo.toml"
            cargo publish --locked --manifest-path "${path}/Cargo.toml"
            wait_for_crate "$crate" "$version"
          }

          for item in "${crates[@]}"; do
            crate="${item%%:*}"
            path="${item#*:}"
            publish_crate "$crate" "$path"
          done

  release:
    permissions:
      contents: write
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
