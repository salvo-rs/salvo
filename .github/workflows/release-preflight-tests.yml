name: Release preflight contract
permissions:
  contents: read
on:
  pull_request:
    paths: ['.github/scripts/*release_preflight.py', '.github/workflows/release*.yml']
  push:
    branches: [main]
    paths: ['.github/scripts/*release_preflight.py', '.github/workflows/release*.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 .github/scripts/test_release_preflight.py
