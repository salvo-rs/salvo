name: Release index contract
permissions:
  contents: read
on:
  pull_request:
    paths:
      - '.github/scripts/check_published.py'
      - '.github/scripts/test_check_published.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-index-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/check_published.py'
      - '.github/scripts/test_check_published.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-index-tests.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  index-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/test_check_published.py
