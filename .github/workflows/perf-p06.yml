name: Performance runtime and feature costs

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - '.github/workflows/perf-p06.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - '.github/workflows/perf-p06.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
      - name: Validate profiling safety
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Record host and profile revisions and features
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/perf-p06
          lscpu > target/perf-p06/cpu.txt
          python3 benchmarks/measure_runtime_costs.py --jobs 2 --samples 128
      - name: Verify both fixtures with a configured native target
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          CARGO_BUILD_TARGET="$host" python3 benchmarks/smoke_configured_artifacts.py
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-p06-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/perf-p06/
            !target/perf-p06/revisions/**
          retention-days: 30
          if-no-files-found: warn
