name: Performance runtime and feature costs

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Commit or ref to compare with the selected revision
        type: string
        default: HEAD^
  pull_request:
    paths:
      - 'crates/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - '.github/workflows/perf-p06.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - '.github/workflows/perf-p06.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BENCHMARK_BASELINE: ${{ inputs.baseline || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
      - name: Validate profiling safety
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Record host and profile revisions and features
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/perf-p06
          lscpu > target/perf-p06/cpu.txt
          if [[ "$BENCHMARK_BASELINE" =~ ^0+$ ]]; then BENCHMARK_BASELINE=HEAD^; fi
          python3 benchmarks/measure_runtime_costs.py --baseline "$BENCHMARK_BASELINE" --jobs 2 --samples 128
      - name: Summarize same-run comparison
        run: python3 benchmarks/summarize_runtime_costs.py target/perf-p06
      - name: Verify both fixtures with a configured native target
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          CARGO_BUILD_TARGET="$host" python3 benchmarks/smoke_configured_artifacts.py
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-p06-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/perf-p06/
            !target/perf-p06/revisions/**
          retention-days: 30
          if-no-files-found: warn
