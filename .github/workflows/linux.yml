name: ci-linux

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.rs'                 # only execute on changes to go files
      - '**/Cargo.toml'         # or dependency updates
      - '.github/workflows/**'  # or workflow changes
  push:
    branches:
      - main
    paths:
      - '**.rs'                 # only execute on changes to go files
      - '**/Cargo.toml'         # or dependency updates
      - '.github/workflows/**'  # or workflow changes

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Typos check with custom config file
        uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master
  udeps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - name: Install cargo-udeps
        uses: taiki-e/install-action@28bfb437c78d9b7ea8650351357e3eb8c0be2672 # cargo-udeps

      - name: Check unused dependencies on default features
        run: cargo udeps

      - name: Check unused dependencies on full features
        run: cargo udeps --features full

      - name: Check unused dependencies on all features
        run: cargo udeps --all-features
  msrv:
    name: Check MSRV - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get MSRV from package metadata
        id: msrv
        run: grep rust-version Cargo.toml | cut -d'"' -f2 | sed 's/^/version=/' >> $GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: rustfmt, clippy

      - name: check crates
        run: cargo check --all --bins --examples --tests

      - name: Check all targets and features on MSRV
        run: cargo check --workspace --all-targets --all-features

      - name: Check Toasty example on MSRV
        run: cargo check --manifest-path examples/Cargo.toml -p example-db-postgres-toasty --all-targets
  test:
    strategy:
        fail-fast: false
        matrix:
          version:
            - stable
            # - nightly
    name: Cargo check ${{ matrix.version }} - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.version }}
          components: rustfmt, clippy

      - name: check build
        run: cargo check --all --bins --examples --tests

      - name: check examples
        run: cargo check --all --bins --examples --tests
        working-directory: ./examples

      - name: check release build
        run: cargo check --all --bins --examples --tests --release

      - name: check doctests
        run: cargo test --workspace --doc

      - name: Cargo test
        timeout-minutes: 40
        run: cargo test --all --all-features --no-fail-fast -- --nocapture

  hack:
    strategy:
        fail-fast: false
        matrix:
          version:
            - nightly
    name: Cargo check ${{ matrix.version }} - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.version }}
          components: rustfmt, clippy

      - name: Install cargo-hack
        run: cargo install cargo-hack

      - name: check --feature-powerset
        run: cargo hack check --feature-powerset --depth 1 -Z avoid-dev-deps --exclude-features server --at-least-one-of aws-lc-rs,ring --exclude-no-default-features

  middleware-features:
    name: Standalone middleware features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check each extra middleware independently
        shell: bash
        run: |
          set -euo pipefail
          for feature in affix-state basic-auth caching-headers catch-panic force-https logging concurrency-limiter size-limiter sse trailing-slash timeout websocket request-id tower-compat; do
            cargo check -p salvo --no-default-features --features "$feature"
          done
      - name: Verify logging does not enable unrelated middleware dependencies
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree -p salvo --no-default-features --features logging --edges normal,build --prefix none)
          if grep -Eq '^(tokio-tungstenite|tungstenite|tower|ulid) v' <<< "$tree"; then
            echo 'logging unexpectedly enabled unrelated middleware dependencies'
            exit 1
          fi
      - name: Test extra middleware without workspace feature unification
        run: cargo test -p salvo_extra --lib --no-default-features --features timeout,catch-panic,size-limiter

  protocols:
    name: Protocol features (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features:
          - ''
          - 'server,http1'
          - 'server,http2'
          - 'server,http1,http2'
          - 'server,http1,websocket'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check selected protocols
        run: cargo check -p salvo --no-default-features --features '${{ matrix.features }}'
      - name: Test core without matched-path
        if: ${{ matrix.features == 'server,http1' }}
        run: cargo test -p salvo_core --lib --no-default-features --features server,http1,test,cookie
      - name: Test core with matched-path
        if: ${{ matrix.features == 'server,http1' }}
        run: cargo test -p salvo_core --lib --no-default-features --features server,http1,test,cookie,matched-path
      - name: Verify HTTP/2 is excluded when disabled
        if: ${{ !contains(matrix.features, 'http2') }}
        shell: bash
        run: |
          tree=$(cargo tree -p salvo --no-default-features --features '${{ matrix.features }}' --edges normal,build --prefix none)
          if grep -q '^h2 v' <<< "$tree"; then
            echo 'HTTP/2 was enabled unexpectedly'
            exit 1
          fi
