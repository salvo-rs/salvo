name: Clippy correctness
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths: ['**.rs', '**/Cargo.toml', '.github/workflows/clippy.yml', '.github/CLIPPY.md']
  push:
    branches: [main]
    paths: ['**.rs', '**/Cargo.toml', '.github/workflows/clippy.yml', '.github/CLIPPY.md']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
          components: clippy
      - name: Record environment and resolve dependencies
        run: |
          mkdir -p clippy-artifacts
          rustc -Vv > clippy-artifacts/environment.txt
          cargo clippy --version >> clippy-artifacts/environment.txt
          git rev-parse HEAD >> clippy-artifacts/environment.txt
          cargo generate-lockfile
          cp Cargo.lock clippy-artifacts/Cargo.lock
      - name: Check correctness lints and retain other diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features --message-format=json -- \
            -D clippy::await_holding_lock -D clippy::if_let_mutex -D clippy::dbg_macro \
            2> >(tee clippy-artifacts/stderr.log >&2) | tee clippy-artifacts/diagnostics.jsonl
      - name: Preserve lint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clippy-${{ github.sha }}-${{ github.run_attempt }}
          path: clippy-artifacts/
          retention-days: 14
          if-no-files-found: warn
