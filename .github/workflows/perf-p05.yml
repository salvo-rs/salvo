name: Performance stream_pressure

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/compression/src/**'
      - 'crates/compression/benches/**'
      - 'crates/compression/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/perf-p05.yml'
  push:
    branches: [main]
    paths:
      - 'crates/compression/src/**'
      - 'crates/compression/benches/**'
      - 'crates/compression/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/perf-p05.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SALVO_BENCH_SAMPLES: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
      - name: Record environment and build benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/perf-p05
          git rev-parse HEAD > target/perf-p05/commit.txt
          rustc -Vv > target/perf-p05/rustc.txt
          lscpu > target/perf-p05/cpu.txt
          cargo metadata --no-deps --format-version 1 > target/perf-p05/metadata.json
          cargo generate-lockfile
          cp Cargo.lock target/perf-p05/Cargo.lock
          cargo build --release --locked -p salvo-compression --bench stream_pressure --message-format=json > target/perf-p05/build.jsonl
      - name: Measure requests and process resources
        shell: bash
        run: |
          set -euo pipefail
          executable=$(python3 -c 'import json,sys; rows=(json.loads(line) for line in open(sys.argv[1])); print(next(r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="stream_pressure" and r.get("executable")))' target/perf-p05/build.jsonl)
          /usr/bin/time -v -o target/perf-p05/resources.txt "$executable" | tee target/perf-p05/samples.csv
      - name: Validate CSV schema and all workload rows
        run: python3 crates/compression/benches/check_stream_pressure_csv.py target/perf-p05/samples.csv crates/compression/benches/results/stream_pressure-windows.csv
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: perf-p05-${{ github.sha }}-${{ github.run_attempt }}
          path: target/perf-p05/
          retention-days: 30
          if-no-files-found: warn
