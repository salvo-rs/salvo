name: Downstream macro and OpenAPI contracts
permissions:
  contents: read
on:
  pull_request:
    paths: ['**/*.rs', '**/Cargo.toml', '.github/fixtures/**', '.github/schemas/**', '.github/scripts/check_macro_contracts.py', '.github/scripts/check_macro_paths.py', '.github/scripts/check_enum_schema_contracts.py', '.github/workflows/macro-contracts.yml']
  push:
    branches: [main]
    paths: ['**/*.rs', '**/Cargo.toml', '.github/fixtures/**', '.github/schemas/**', '.github/scripts/check_macro_contracts.py', '.github/scripts/check_macro_paths.py', '.github/scripts/check_enum_schema_contracts.py', '.github/workflows/macro-contracts.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - run: python3 -m pip install jsonschema==4.26.0
      - run: python3 .github/scripts/check_macro_contracts.py
      - run: python3 .github/scripts/check_macro_paths.py
      - run: python3 .github/scripts/check_enum_schema_contracts.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: downstream-macro-contract
          path: |
            target/downstream-macro-contract/*.log
            target/downstream-macro-contract/openapi.json
            target/downstream-macro-contract/Cargo.lock
            target/macro-path-contract/*.log
            target/macro-path-contract/Cargo.lock
