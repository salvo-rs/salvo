[package]
name = "salvo-cache"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = """
Cache middleware for Salvo web server framework.
"""
homepage = { workspace = true }
repository = { workspace = true }
readme = "./README.md"
keywords = { workspace = true }
license = { workspace = true }
categories = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "cache_headers"
harness = false

[features]
default = ["moka-store"]
full = ["moka-store"]
moka-store = ["dep:moka"]

[dependencies]
bytes = { workspace = true }
moka = { workspace = true, optional = true, features = ["future"] }
salvo_core = { workspace = true, features = ["http1"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
stats_alloc = "0.1.10"
salvo_core = { workspace = true, features = ["test", "cookie", "server", "server-handle"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
time = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "cache_chunks"
harness = false
