[package]
name = "salvo-otel"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = """
OpenTelemetry support for salvo web server framework.
"""
homepage = { workspace = true }
repository = { workspace = true }
readme = "./README.md"
keywords = ["http", "OpenTelemetry", "web", "framework", "server"]
license = { workspace = true }
categories = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["matched-path"]
matched-path = ["salvo_core/matched-path"]

[dependencies]
opentelemetry-http = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true, features = [
    "semconv_experimental",
] }
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
percent-encoding = { workspace = true }
salvo_core = { workspace = true, default-features = false, features = ["response-observers"] }
tracing = { workspace = true }

[dev-dependencies]
salvo_extra = { workspace = true, default-features = false, features = ["timeout", "catch-panic", "tower-compat"] }
tower = { workspace = true, features = ["util"] }
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"] }
salvo_core = { workspace = true, features = ["test"] }
tokio = { workspace = true }

[lints]
workspace = true
